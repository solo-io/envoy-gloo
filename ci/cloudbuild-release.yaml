# Submitted by the Release workflow (.github/workflows/release.yaml).
steps:
- name: 'gcr.io/cloud-builders/gsutil'
  id: 'check-version'
  entrypoint: 'bash'
  args:
  - '-ec'
  - |
    case "$$TAGGED_VERSION" in
      v*) ;;
      *) echo "_TAGGED_VERSION must be set and start with v, got '$$TAGGED_VERSION'" >&2; exit 1 ;;
    esac
  env:
  - 'TAGGED_VERSION=$_TAGGED_VERSION'

- name: 'envoyproxy/envoy-build-ubuntu:86873047235e9b8232df989a5999b9bebf9db69c'
  id: 'gengo'
  args: ['make', 'check-gencode']
  volumes:
  - name: 'vol-build'
    path: '/build'
  env:
  - 'COMMIT_SHA=$COMMIT_SHA'
  - 'BAZEL_REMOTE_CACHE=https://storage.googleapis.com/envoy-build-cache-solo-io'
  - 'BUILD_TYPE=$_BUILD_TYPE'
  secretEnv:
  - 'GCP_SERVICE_ACCOUNT_KEY'

- name: 'envoyproxy/envoy-build-ubuntu:86873047235e9b8232df989a5999b9bebf9db69c'
  id: 'do_ci'
  args:
  - 'ci/do_ci.sh'
  - 'release'
  - '//test/extensions/...'
  - '//test/common/...'
  - '//test/integration/...'
  # proxy_protocol tests are for validating bazel/foreign_cc/tlv-support.patch
  - '@envoy//test/extensions/common/proxy_protocol/...'
  - '@envoy//test/extensions/transport_sockets/proxy_protocol/...'
  volumes:
  - name: 'vol-build'
    path: '/build'
  env:
  - 'COMMIT_SHA=$COMMIT_SHA'
  - 'BAZEL_REMOTE_CACHE=https://storage.googleapis.com/envoy-build-cache-solo-io'
  - 'BUILD_TYPE=$_BUILD_TYPE'
  secretEnv:
  - 'GCP_SERVICE_ACCOUNT_KEY'

- name: 'envoyproxy/envoy-build-ubuntu:86873047235e9b8232df989a5999b9bebf9db69c'
  id: 'static_analysis'
  allowFailure: true
  args: ['ci/static_analysis.sh']
  volumes:
  - name: 'vol-build'
    path: '/build'
  env:
  - 'COMMIT_SHA=$COMMIT_SHA'
  - 'BAZEL_REMOTE_CACHE=https://storage.googleapis.com/envoy-build-cache-solo-io'
  - 'BUILD_TYPE=$_BUILD_TYPE'
  secretEnv:
  - 'GCP_SERVICE_ACCOUNT_KEY'

- name: 'gcr.io/cloud-builders/docker'
  id: 'docker-release'
  entrypoint: 'bash'
  args: ['-c', 'docker login quay.io --username "solo-io+solobot" --password $$QUAY_IO_PASSWORD && cp linux/amd64/build_envoy_release_stripped/envoy ci/envoy.stripped && make docker-release']
  env:
  - 'TAGGED_VERSION=$_TAGGED_VERSION'
  - 'COMMIT_SHA=$COMMIT_SHA'
  secretEnv:
    - 'QUAY_IO_PASSWORD'
  volumes:
  - name: 'vol-build'
    path: '/build'

- name: gcr.io/cloud-builders/gsutil
  entrypoint: 'bash'
  args:
  - '-ec'
  - |
    if [ -z "$$TAGGED_VERSION" ]; then exit 0; fi
    gsutil cp ./linux/amd64/build_envoy_release_stripped/envoy gs://solo-public-artifacts.solo.io/envoy/$${TAGGED_VERSION}/envoy.stripped
  id: 'save-tagged-version'
  env:
  - 'TAGGED_VERSION=$_TAGGED_VERSION'

substitutions:
  _TAGGED_VERSION: ''
  _BUILD_TYPE: ''

options:
  logging: CLOUD_LOGGING_ONLY
  pool:
    name: 'projects/solo-public/locations/us-central1/workerPools/envoy-gloo-runner'
timeout: 20000s
# A re-run of the Release job attaches to a still-running build, so a queued
# build may wait up to an hour.
queueTtl: '3600s'

artifacts:
  objects:
    location: 'gs://solo-public-artifacts.solo.io/envoy/$COMMIT_SHA/'
    paths: ['linux/amd64/build_envoy_release/envoy']

tags:
  - "repo_envoy-gloo"
  - "release"

availableSecrets:
  secretManager:
    # Placeholder name pending the platform Terraform.
    - versionName: projects/solo-public/secrets/envoy-gloo-quay-io-password/versions/latest
      env: 'QUAY_IO_PASSWORD'
    - versionName: projects/gloo-ee/secrets/envoy-build-cache-sa/versions/2
      env: 'GCP_SERVICE_ACCOUNT_KEY'
